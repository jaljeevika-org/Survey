<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Jaljeevika Survey Portal - Share your feedback on water resources, fisheries, and community development">
    <title>Jaljeevika Survey Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0077B6;
            --primary-dark: #023E8A;
            --primary-light: #00B4D8;
            --accent-green: #2D9D78;
            --accent-teal: #48CAE4;
            --white: #FFFFFF;
            --off-white: #F8FAFB;
            --gray-light: #E9ECEF;
            --gray: #6C757D;
            --gray-dark: #343A40;
            --shadow: 0 2px 8px rgba(0, 119, 182, 0.08);
            --shadow-hover: 0 8px 24px rgba(0, 119, 182, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--off-white);
            min-height: 100vh;
            color: var(--gray-dark);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-light);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 48px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.3px;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--gray);
            font-weight: 400;
        }

        /* Language Selector */
        .language-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 8px 16px;
            border: 1px solid var(--gray-light);
            background: var(--white);
            color: var(--gray-dark);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .lang-btn.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
            color: var(--white);
        }

        /* Hero Section */
        .hero {
            background: var(--white);
            padding: 48px 20px;
            text-align: center;
            border-bottom: 1px solid var(--gray-light);
        }

        .hero-content {
            max-width: 640px;
            margin: 0 auto;
        }

        .hero h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-dark);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1rem;
            color: var(--gray);
            max-width: 480px;
            margin: 0 auto;
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        /* Survey Grid */
        .survey-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .survey-card {
            background: var(--white);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--gray-light);
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .survey-card:hover {
            border-color: var(--primary-blue);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .card-icon.water {
            background: linear-gradient(135deg, #E0F4FF, #B8E6FF);
        }

        .card-icon.fish {
            background: linear-gradient(135deg, #E3F6F1, #B8EBE0);
        }

        .card-icon.agri {
            background: linear-gradient(135deg, #FFF8E0, #FFECB3);
        }

        .card-icon.community {
            background: linear-gradient(135deg, #F3E8FF, #E0CFFF);
        }

        .card-icon.quality {
            background: linear-gradient(135deg, #E0F7FF, #B3ECFF);
        }

        .card-icon.economic {
            background: linear-gradient(135deg, #FFF0E0, #FFE0C2);
        }

        .card-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-dark);
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 0.875rem;
            color: var(--gray);
            line-height: 1.5;
        }

        .card-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--gray-light);
            margin-top: auto;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background: var(--primary-dark);
        }

        .start-btn svg {
            width: 16px;
            height: 16px;
        }

        .card-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            background: var(--off-white);
            color: var(--gray);
            border-radius: 12px;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            background: var(--white);
            border-top: 1px solid var(--gray-light);
            padding: 24px 20px;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer p {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .header-content {
                justify-content: center;
            }

            .logo-section {
                width: 100%;
                justify-content: center;
            }

            .language-selector {
                width: 100%;
                justify-content: center;
            }

            .lang-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            .hero {
                padding: 32px 16px;
            }

            .hero h2 {
                font-size: 1.5rem;
            }

            .hero p {
                font-size: 0.9rem;
            }

            .main-content {
                padding: 24px 16px 40px;
            }

            .survey-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .survey-card {
                padding: 20px;
            }

            .card-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            .card-info h3 {
                font-size: 0.95rem;
            }

            .card-info p {
                font-size: 0.825rem;
            }

            .start-btn {
                padding: 10px 16px;
                font-size: 0.825rem;
            }

            .footer {
                padding: 20px 16px;
            }
        }

        @media (max-width: 380px) {
            .lang-btn {
                padding: 5px 10px;
                font-size: 0.75rem;
            }

            .logo-text h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

        translations.te.comingSoon = 'త్వరలో వస్తుంది! ఈ సర్వే ప్రస్తుతం అభివృద్ధిలో ఉంది.';

        let currentLang = 'en';
        const surveyBaseUrl = 'https://script.google.com/a/macros/jaljeevika.org/s/AKfycbz-rCb_T8r_LIr1DAyIIEBWRkuE6h1zIpWy5ziY6ePxblDuvp-Fioo1cPW6A5clKj8OdQ/exec';
        const logoUrl = 'https://storage.googleapis.com/jaljeevika_chatbot/Logo.jpg';

        function changeLanguage(lang) {
            currentLang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const t = translations[lang];
            document.getElementById('tagline').textContent = t.tagline;
            document.getElementById('heroTitle').textContent = t.heroTitle;
            document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
            document.getElementById('sectionLabel').textContent = t.sectionLabel;
            document.getElementById('footerText').innerHTML = t.footerText;

            renderSurveys();
        }

        function renderSurveys() {
            const t = translations[currentLang];
            const grid = document.getElementById('surveyGrid');

            grid.innerHTML = t.surveys.map((survey, index) => `
                <div class="survey-card" onclick="openSurvey(${index + 1})">
                    <div class="card-header">
                        <div class="card-icon ${survey.iconClass}">${survey.icon}</div>
                        <div class="card-info">
                            <h3>${survey.title}</h3>
                            <p>${survey.description}</p>
                        </div>
                    </div>
                    <div class="card-action">
                        <button class="start-btn">
                            ${t.btnText}
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </button>
                        <span class="card-badge">${t.badge}</span>
                    </div>
                </div>
            `).join('');
        }

        function openSurvey(surveyId) {
            // Only allow the first survey (Water Body Survey)
            if (surveyId === 1) {
                const url = `${surveyBaseUrl}?survey=${surveyId}&lang=${currentLang}`;
                window.open(url, '_blank');
            } else if (surveyId === 2) {
                // Baseline survey
                const url = `https://script.google.com/macros/s/AKfycbxCG60pXHlSBb9luPe-ujuvCSxzlgr_XRQYzyJN9wpy9uUhNGvV4oKbnpdILbThjYVz/exec?logo=${encodeURIComponent(logoUrl)}`;
                window.open(url, '_blank');
            } else if (surveyId === 3) {
                // Training Certificate Request Form
                const url = 'https://script.google.com/a/macros/jaljeevika.org/s/AKfycbxOKfzfYSVmoa5UJnhzyAFPpo3vJ7_QZmYFo1q31E36Km7iSCMGOYL4lvPTHmL_UPYZDg/exec';
                window.open(url, '_blank');
            } else if (surveyId === 4) {
                // Training Session Report Form
                const url = `https://script.google.com/macros/s/AKfycbyGv5kGQMtfFcdazEojaHzBCYEoGO_zroYTkZOPslr25Kwbb_wx1k3c9Oxz0r6M63AC/exec?logo=${encodeURIComponent(logoUrl)}`;
                window.open(url, '_blank');
            } else {
                // Show coming soon alert for all other surveys
                alert(translations[currentLang].comingSoon || translations['en'].comingSoon);
            }
        }

        renderSurveys();
    </script>
</body>

</html>
